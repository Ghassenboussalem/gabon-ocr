<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification — Actes de naissance</title>
<style>
  :root{
    --paper:#FAF7F0; --paper-2:#F1ECE1; --ink:#1B2A41; --ink-soft:#4A5568;
    --rule:#D8D1C0; --stamp:#8C3B2E; --amber:#B07C2A; --green:#2E6B4F;
    --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Menlo,monospace;
    --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
  header{display:flex;align-items:baseline;gap:16px;padding:14px 22px;border-bottom:2px solid var(--ink);background:var(--paper)}
  header h1{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;letter-spacing:.2px}
  header .sub{color:var(--ink-soft);font-size:13px}
  select,button,input{font:inherit;color:var(--ink)}
  select{background:var(--paper);border:1px solid var(--rule);padding:6px 10px;border-radius:3px}
  main{display:grid;grid-template-columns:minmax(320px,44%) 1fr;gap:0;height:calc(100vh - 59px)}
  #docpane{border-right:1px solid var(--rule);overflow:auto;background:var(--paper-2);padding:16px;text-align:center}
  #docpane img{max-width:100%;cursor:zoom-in;border:1px solid var(--rule);background:#fff}
  #docpane img.zoom{max-width:none;width:170%;cursor:zoom-out}
  #fields{overflow:auto;padding:18px 22px 90px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  button{border:1px solid var(--ink);background:var(--paper);padding:8px 14px;border-radius:3px;cursor:pointer}
  button.primary{background:var(--ink);color:var(--paper)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .fieldcard{border:1px solid var(--rule);background:#fff;border-radius:4px;padding:12px 14px;margin-bottom:12px}
  .fieldcard.review{border-left:4px solid var(--amber)}
  .fieldcard.low{border-left:4px solid var(--stamp)}
  .fieldcard.accepted{border-left:4px solid var(--green)}
  .fieldrow{display:flex;gap:14px;align-items:flex-start}
  .fieldmeta{min-width:210px}
  .fname{font-weight:600;font-size:14px}
  .ftype{color:var(--ink-soft);font-size:12px}
  .chip{display:inline-block;margin-top:6px;padding:2px 9px;border:1.5px solid;border-radius:3px;
        font-family:var(--mono);font-size:11.5px;letter-spacing:.6px;transform:rotate(-1.6deg)}
  .chip.high{color:var(--green);border-color:var(--green)}
  .chip.medium{color:var(--amber);border-color:var(--amber)}
  .chip.low{color:var(--stamp);border-color:var(--stamp)}
  .fvalue{flex:1}
  .crop{display:block;max-width:100%;max-height:110px;border:1px solid var(--rule);background:#fff;margin-bottom:8px}
  input.val{width:100%;font-family:var(--mono);font-size:15px;padding:8px 10px;border:1px solid var(--rule);
            border-radius:3px;background:var(--paper)}
  .sources{font-size:12px;color:var(--ink-soft);margin-top:6px;font-family:var(--mono)}
  .finding{font-size:13px;margin-top:6px;padding-left:10px;border-left:3px solid var(--rule)}
  .finding.warn{border-color:var(--amber);color:#7a5716}
  .finding.fail{border-color:var(--stamp);color:var(--stamp)}
  .finding.ok{border-color:var(--green);color:var(--green)}
  #savebar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:12px;align-items:center;
           padding:12px 22px;background:var(--paper);border-top:2px solid var(--ink)}
  #status{color:var(--ink-soft);font-size:13px}
  .donestamp{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);
             font-family:var(--serif);font-size:64px;font-weight:700;color:var(--green);
             border:5px solid var(--green);padding:6px 30px;border-radius:6px;background:rgba(250,247,240,.9);
             letter-spacing:6px;opacity:0;pointer-events:none;transition:opacity .25s}
  .donestamp.show{opacity:.95}
  @media (max-width:900px){main{grid-template-columns:1fr}#docpane{max-height:38vh}}
  @media (prefers-reduced-motion: reduce){.donestamp{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Bureau de vérification</h1>
  <span class="sub">actes de naissance — extraction assistée</span>
  <span class="spacer" style="flex:1"></span>
  <label for="runsel" class="sub">Document&nbsp;</label>
  <select id="runsel" aria-label="Choisir un document"></select>
</header>

<main>
  <div id="docpane"><img id="overlay" alt="Document avec champs localisés" src="" onclick="this.classList.toggle('zoom')"></div>
  <div id="fields">
    <div class="toolbar">
      <span id="summary" class="sub"></span>
      <span class="spacer"></span>
      <button id="acceptHigh" type="button">Accepter la confiance haute</button>
    </div>
    <div id="cards"></div>
  </div>
</main>

<div id="savebar">
  <button class="primary" id="save" type="button">Enregistrer les corrections</button>
  <span id="status">Entrée : champ suivant · Ctrl+Entrée : enregistrer</span>
</div>
<div class="donestamp" id="donestamp">TRAITÉ</div>

<script>
const S = { run:null, report:null, accepted:new Set() };

async function loadRuns(){
  const runs = await (await fetch('/api/runs')).json();
  const sel = document.getElementById('runsel');
  sel.innerHTML = runs.map(r =>
    `<option value="${r.doc_id}">${r.doc_id} — ${r.corrected?'traité':(r.review_count+' à vérifier')}</option>`).join('');
  sel.onchange = () => loadRun(sel.value);
  const want = new URLSearchParams(location.search).get('doc');
  const first = want && runs.some(r=>r.doc_id===want) ? want : (runs[0]||{}).doc_id;
  if(first){ sel.value = first; loadRun(first); }
}

async function loadRun(id){
  S.run = id; S.accepted = new Set();
  S.report = await (await fetch('/api/run/'+id)).json();
  document.getElementById('overlay').src = S.report.overlay_url || '';
  render();
}

function order(fields){
  return Object.entries(fields).sort((a,b)=> a[1].score - b[1].score);
}

function render(){
  const r = S.report, cards = document.getElementById('cards');
  const nRev = Object.values(r.fields).filter(f=>f.needs_review).length;
  document.getElementById('summary').textContent =
    `${r.fields_total} champs · ${r.fields_total-nRev} acceptés automatiquement · ${nRev} à vérifier`;
  cards.innerHTML = order(r.fields).map(([name,f])=>{
    const cls = f.band==='low' ? 'low' : (f.needs_review ? 'review':'accepted');
    const corrected = r.corrected?.fields?.[name];
    const val = corrected !== undefined && corrected !== null ? corrected : (f.value ?? '');
    const srcs = (f.page_value!==undefined) ?
      `page: ${f.page_value ?? '∅'} · découpe: ${f.crop_value ?? '∅'} · accord: ${f.agreement===null?'—':(f.agreement?'oui':'NON')}` : '';
    return `<div class="fieldcard ${cls}" data-name="${name}">
      <div class="fieldrow">
        <div class="fieldmeta">
          <div class="fname">${name}</div>
          <div class="ftype">${f.type||''}</div>
          <span class="chip ${f.band}">${f.band==='high'?'CONF. HAUTE':(f.band==='medium'?'À VÉRIFIER':'CONF. BASSE')} ${Math.round(f.score*100)}</span>
        </div>
        <div class="fvalue">
          ${f.crop_url?`<img class="crop" loading="lazy" src="${f.crop_url}" alt="extrait ${name}">`:''}
          <input class="val" value="${(val??'').toString().replace(/"/g,'&quot;')}"
                 aria-label="valeur ${name}" data-name="${name}">
          <div class="sources">${srcs}</div>
          ${(f.findings||[]).map(x=>`<div class="finding ${x.level}">${x.message}</div>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');

  const inputs=[...cards.querySelectorAll('input.val')];
  inputs.forEach((inp,i)=>{
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter' && !e.ctrlKey){e.preventDefault();(inputs[i+1]||inputs[0]).focus();(inputs[i+1]||inputs[0]).select();}
    });
  });
  if(inputs.length){inputs[0].focus();inputs[0].select();}
}

document.getElementById('acceptHigh').onclick=()=>{
  // keep model values for every high-confidence field; just jump focus to the first field needing review
  const first=[...document.querySelectorAll('.fieldcard.review input.val,.fieldcard.low input.val')][0];
  if(first){first.focus();first.select();}
};

async function save(){
  const fields={};
  document.querySelectorAll('input.val').forEach(i=>fields[i.dataset.name]=i.value.trim()||null);
  const res=await fetch(`/api/run/${S.run}/save`,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fields, reviewer:'clerk'})});
  const out=await res.json();
  document.getElementById('status').textContent=
    `Enregistré — ${out.changed_fields} correction(s) ajoutée(s) au corpus d'entraînement.`;
  const st=document.getElementById('donestamp');st.classList.add('show');
  setTimeout(()=>st.classList.remove('show'),1200);
}
document.getElementById('save').onclick=save;
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')save();});

loadRuns();
</script>
</body>
</html>
